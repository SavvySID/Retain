[project]
name = "telecom-churn-explainability"
version = "1.0.0"
description = "A reproducible, explainable telecom churn college project."
requires-python = ">=3.12,<3.14"
dependencies = ["flask>=3.1,<4", "waitress>=3,<4", "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "shap>=0.48,<1", "xgboost>=3,<4", "matplotlib>=3.9,<4", "joblib>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 110
